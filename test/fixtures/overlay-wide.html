<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>overlay-wide</title>
<style>body{margin:0;font:16px sans-serif}.hero{position:relative;height:400px;padding:40px}.cta{position:absolute;left:40px;top:150px;width:220px;height:60px}.glow{display:none;position:absolute;inset:0;z-index:5;background:radial-gradient(circle at 20% 40%,rgba(255,200,0,.4),transparent 60%)}@media (min-width:1000px){.glow{display:block}}</style></head>
<body>
<section class="hero">
<h1>Ship faster</h1>
<button class="cta" type="button">Start free trial</button>
<div class="glow"></div>
</section>
</body></html>
