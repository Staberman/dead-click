<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>shadow-overlay</title>
<style>body{margin:0;font:16px sans-serif}#host{position:absolute;left:40px;top:40px;width:240px;height:80px;display:block}#overlay{position:absolute;left:0;top:0;width:400px;height:200px;z-index:5;background:rgba(255,0,0,.15)}</style></head>
<body>
<div id="host"></div>
<div id="overlay"></div>
<script>
const root = document.getElementById("host").attachShadow({ mode: "open" });
root.innerHTML = "<style>button{width:240px;height:80px}</style><button class=\"inner\" type=\"button\">Inside shadow</button>";
</script>
</body></html>
