<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>hidden-checkbox</title>
<style>body{margin:0;font:16px sans-serif}.field{position:relative;margin:40px}.field input{position:absolute;left:0;top:0;width:24px;height:24px;margin:0;z-index:0}.field label{position:relative;z-index:1;display:inline-block;padding-left:32px;line-height:24px;cursor:pointer}.field label::before{content:"";position:absolute;left:0;top:0;width:24px;height:24px;border:2px solid #333;box-sizing:border-box;background:#fff}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}</style></head>
<body>
<div class="field"><input id="agree" type="checkbox"><label for="agree">I agree</label></div>
<div class="field"><input class="sr-only" id="news" type="checkbox"><label for="news">Newsletter</label></div>
</body></html>
